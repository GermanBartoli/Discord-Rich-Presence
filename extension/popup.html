<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>YouTube Music</h1>
  <label class="switch"><input id="enabled" type="checkbox"> Activar actividad en Discord</label>
  <p id="status" role="status">Comprobando conexión…</p>
  <details>
    <summary>Ajustes de YouTube Music</summary>
    <label><input type="checkbox" data-setting="privacyMode"> Modo privacidad</label>
    <label><input type="checkbox" data-setting="showCover"> Mostrar carátula</label>
    <label><input type="checkbox" data-setting="showTimestamps"> Mostrar tiempo</label>
    <label><input type="checkbox" data-setting="hidePaused"> Ocultar en pausa</label>
    <label><input type="checkbox" data-setting="showBrowsing"> Mostrar navegación</label>
    <label><input type="checkbox" data-setting="showButtons"> Mostrar botones</label>
    <label><input type="checkbox" data-setting="links"> Abrir canción al hacer clic en el título</label>
  </details>
  <small>Necesitás Discord de escritorio y el conector local instalado.</small>
  <script src="popup.js"></script>
</body>
</html>
